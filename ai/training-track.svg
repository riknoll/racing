<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 76">
    <title>Test Track: short bends, two hairpins, and a safe recovery straight</title>
    <rect width="94" height="76" fill="#31564f"/>
    <!-- Coordinates are tile units. Eight-tile hairpin gaps leave room to steer. -->
    <path id="practice-loop" fill="none" stroke="#eeeeee" stroke-width="4"
        d="M10 10 L34 10 L50 18 L68 18 L68 34 L84 34 L84 42 L46 42 L46 50 L84 50 L84 66 L10 66 Z"/>
    <path stroke="red" stroke-width="0.5" d="M10 10 L34 10"/>
    <path stroke="yellow" stroke-width="0.5" d="M10 66 L10 10"/>
    <g fill="#ffffff" font-family="sans-serif" font-size="2">
        <text x="14" y="7">Start / brake</text>
        <text x="31" y="6">Gentle right</text>
        <text x="43" y="23">Gentle left / recovery</text>
        <text x="70" y="17">Sharp right</text>
        <text x="60" y="32">Sharp left</text>
        <text x="72" y="39">Right hairpin</text>
        <text x="48" y="47">Left hairpin</text>
    </g>
</svg>
